<title>قِوام</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
  :root{
    color-scheme: dark;
    --bg:#0A0C0B; --surface:#131715; --surface2:#1A201D; --line:rgba(255,255,255,.075);
    --t1:#EDF2EE; --t2:#A9B5AE; --t3:#74807A;
    --acc:#C8F751; --accInk:#0A0C0B; --accText:#C8F751; --accSoft:rgba(200,247,81,.12);
    --p:#C8F751; --c:#7FD4FF; --f:#FFC46B; --warn:#FFC46B;
    --track:rgba(255,255,255,.09); --trackBg:rgba(255,255,255,.08);
    --ghostBg:rgba(255,255,255,.05); --ghostLine:rgba(255,255,255,.09);
    --shadow:0 18px 50px rgba(0,0,0,.55); --page:#070908;
    --navBg:rgba(10,12,11,.94);
  }
  :root[data-app-theme="light"]{
    color-scheme: light;
    --bg:#F4F6F1; --surface:#FFFFFF; --surface2:#F0F3EC; --line:rgba(16,21,18,.08);
    --t1:#101512; --t2:#4F5A54; --t3:#7C877F;
    --acc:#C8F751; --accInk:#0A0C0B; --accText:#4C7A0B; --accSoft:rgba(139,194,32,.16);
    --p:#8DC22A; --c:#35A3DC; --f:#E0A03A; --warn:#C07A12;
    --track:rgba(16,21,18,.08); --trackBg:rgba(16,21,18,.08);
    --ghostBg:#FFFFFF; --ghostLine:rgba(16,21,18,.10);
    --shadow:0 18px 50px rgba(16,21,18,.14); --page:#E7EBE1;
    --navBg:rgba(244,246,241,.95);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--page);font-family:'Readex Pro','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--t1)}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:12px}
  .num{font-family:'Space Grotesk','Readex Pro',system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

  .stage{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px}
  .demobar{display:flex;align-items:center;gap:8px;width:100%;max-width:430px}
  .demobar .brand{display:flex;align-items:center;gap:8px;margin-inline-end:auto}
  .dot{width:26px;height:26px;border-radius:9px;background:var(--acc);color:var(--accInk);display:flex;align-items:center;justify-content:center}
  .tinybtn{min-height:34px;padding:0 12px;border-radius:11px;background:var(--ghostBg);border:1px solid var(--ghostLine);display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t2)}
  .tinybtn.on{background:var(--acc);border-color:var(--acc);color:var(--accInk);font-weight:500}

  .phone{width:100%;max-width:430px;height:min(880px,calc(100dvh - 76px));background:var(--bg);color:var(--t1);
    border-radius:30px;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative}
  @media (max-width:520px){
    .stage{padding:0;gap:0;justify-content:flex-start}
    .demobar{max-width:none;padding:8px 12px 4px}
    .phone{max-width:none;height:calc(100dvh - 50px);border-radius:0;border:0;box-shadow:none}
  }
  .scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .scroll::-webkit-scrollbar{width:0}
  .view{display:flex;flex-direction:column;gap:14px;padding:18px 20px 22px}

  .glow{position:absolute;border-radius:999px;filter:blur(70px);opacity:.45;pointer-events:none;z-index:0}
  .head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
  .rowc{display:flex;align-items:center;gap:12px}
  .between{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .col{display:flex;flex-direction:column}
  .grow{flex:1}
  .d1{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.12}
  .h1{font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
  .h2{font-size:16.5px;font-weight:600;line-height:1.35}
  .h3{font-size:14.5px;font-weight:500;line-height:1.4}
  .b1{font-size:13.5px;font-weight:300;line-height:1.6}
  .b2{font-size:12px;font-weight:300;line-height:1.5}
  .cap{font-size:10.5px;font-weight:400;letter-spacing:.05em}
  .t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}
  .acc{color:var(--accText)}.mP{color:var(--p)}.mC{color:var(--c)}.mF{color:var(--f)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:22px}
  .card2{background:var(--surface2);border:1px solid var(--line);border-radius:16px}
  .hair{height:1px;background:var(--line)}
  .fill{background:var(--acc);color:var(--accInk)}
  .ghost{background:var(--ghostBg);border:1px solid var(--ghostLine);color:var(--t1)}
  .softacc{background:var(--accSoft);color:var(--accText)}
  .btn{min-height:52px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:500;width:100%}
  .chip{min-height:38px;padding:0 14px;border-radius:12px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
  .tag{min-height:26px;padding:0 10px;border-radius:9px;display:inline-flex;align-items:center;font-size:11px}
  .seg{background:var(--ghostBg);border:1px solid var(--line);border-radius:14px;padding:4px;display:flex;gap:4px}
  .seg button{flex:1;min-height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--t2)}
  .seg button.on{background:var(--acc);color:var(--accInk);font-weight:500}
  .scrollx{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
  .scrollx::-webkit-scrollbar{height:0}
  .bar{height:6px;border-radius:99px;background:var(--trackBg);overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:99px}
  .ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .ic18{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .ic14{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .sq{display:flex;align-items:center;justify-content:center;flex:none}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;width:100%}
  .press{transition:transform .12s ease,opacity .12s ease}
  .press:active{transform:scale(.985);opacity:.9}

  nav.tabs{flex:none;height:84px;background:var(--navBg);border-top:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;padding:10px 18px 0;backdrop-filter:blur(12px)}
  nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:5px;width:58px;min-height:46px;color:var(--t3)}
  nav.tabs button.on{color:var(--accText)}
  .fab{width:56px;height:56px;border-radius:20px;background:var(--acc);color:var(--accInk);display:flex;align-items:center;justify-content:center;margin-top:-14px;box-shadow:0 10px 24px rgba(200,247,81,.22)}
  :root[data-app-theme="light"] .fab{background:#1B2318;color:#DFFF8E;box-shadow:0 10px 24px rgba(16,21,18,.2)}

  .sheet{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:40}
  .sheet>div{width:100%;background:var(--surface);border-radius:26px 26px 0 0;border-top:1px solid var(--line);padding:16px 18px 22px;display:flex;flex-direction:column;gap:14px;max-height:88%;overflow-y:auto}
  .grip{width:38px;height:4px;border-radius:99px;background:var(--track);align-self:center}
  .toast{position:absolute;left:50%;transform:translateX(-50%);bottom:104px;background:var(--acc);color:var(--accInk);
    padding:11px 18px;border-radius:14px;font-size:13px;font-weight:500;z-index:60;box-shadow:0 10px 24px rgba(0,0,0,.3)}
  input.f{width:100%;min-height:48px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;
    padding:0 14px;color:var(--t1);font-size:14px;font-family:inherit}
  input.f::placeholder{color:var(--t3)}
  input.f:focus{outline:none;border-color:var(--acc)}
  .stepper{display:flex;align-items:center;gap:10px}
  .stepper button{width:40px;height:40px;border-radius:13px;background:var(--ghostBg);border:1px solid var(--ghostLine);display:flex;align-items:center;justify-content:center}
  .msg{max-width:82%;padding:12px 14px;border-radius:20px}
  .msg.me{align-self:flex-end;background:var(--acc);color:var(--accInk);border-radius:20px 20px 6px 20px}
  .msg.you{align-self:flex-start;background:var(--surface2);border:1px solid var(--line);border-radius:20px 20px 20px 6px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="stage">
  <div class="demobar">
    <div class="brand">
      <div class="dot"><svg class="ic14" viewBox="0 0 24 24" style="stroke-width:2"><path d="M4 9.2v5.6M7.2 6.8v10.4M16.8 6.8v10.4M20 9.2v5.6M7.2 12h9.6"/></svg></div>
      <div style="font-size:13px;font-weight:600">قِوام</div>
      <div class="b2 t3">نموذج تجريبي</div>
    </div>
    <button class="tinybtn" id="roleBtn">وضع المدرّب</button>
    <button class="tinybtn" id="themeBtn">فاتح</button>
    <button class="tinybtn" id="resetBtn" title="تصفير البيانات">↺</button>
  </div>
  <div class="phone" dir="rtl">
    <div class="scroll" id="scroll"><div class="view" id="screen"></div></div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</div>

<script>

var $ = function(s){ return document.querySelector(s); };
var ar = window.__ar, svg = window.__svg, esc = window.__esc, el = window.__el;

/* ---------- state ---------- */
var KEY = "qiwam.v2";
var MEALS = ["الفطور","الغداء","سناك","العشاء"];

function seed(){

    ]

}
function item(id, qty){
  var f = window.__FOOD_BY_ID[id];
  return { fid:id, n:f.n, u:f.u, base:f.base, qty:qty, kcal:f.kcal, p:f.p, c:f.c, f:f.f };
}
var S;
try { S = JSON.parse(localStorage.getItem(KEY)) || seed(); } catch(e){ S = seed(); }
if (!S.profile || !S.day) S = seed();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

/* ---------- nutrition math ---------- */
function bmr(){
  var p = S.profile;
  return 10*p.w + 6.25*p.h - 5*p.age + (p.gender === "male" ? 5 : -161);
}
var ACT = { light:{f:1.375, n:"خفيف", d:"مكتبي · أقل من ٥٬٠٠٠ خطوة"},
            moderate:{f:1.55, n:"متوسط", d:"تمرين ٣–٤ أيام بالأسبوع"},
            high:{f:1.725, n:"عالي", d:"تمرين يومي أو عمل بدني"} };
function tdee(){ return bmr() * ACT[S.profile.activity].f; }
function targets(){
  var kcal = Math.round((tdee() - S.profile.rate * 1000) / 10) * 10;
  kcal = Math.max(1200, kcal);
  var sp = window.__DIET_BY_ID[S.profile.diet].split;
  return { kcal:kcal, p:Math.round(kcal*sp.p/4), c:Math.round(kcal*sp.c/4), f:Math.round(kcal*sp.f/9), split:sp };
}
function amount(it){ return it.qty / it.base; }
function itemTotals(it){
  var m = amount(it);
  return { kcal: it.kcal*m, p: it.p*m, c: it.c*m, f: it.f*m };
}
function mealTotals(name){
  var t = {kcal:0,p:0,c:0,f:0};
  (S.day.meals[name]||[]).forEach(function(it){
    var v = itemTotals(it); t.kcal+=v.kcal; t.p+=v.p; t.c+=v.c; t.f+=v.f;
  });
  return t;
}
function dayTotals(){
  var t = {kcal:0,p:0,c:0,f:0};
  MEALS.forEach(function(m){ var v = mealTotals(m); t.kcal+=v.kcal; t.p+=v.p; t.c+=v.c; t.f+=v.f; });
  return t;
}
function stepBurn(){ return Math.round(S.day.steps * 0.04); }
function stepKm(){ return S.day.steps * 0.00072; }

/* ---------- ui atoms ---------- */
function ring(percent, size, stroke, color, inner){
  var r = (size - stroke) / 2, C = 2 * Math.PI * r, dash = C * clampP(percent) / 100;
  return '<div style="position:relative;width:'+size+'px;height:'+size+'px;flex:none">'+
    '<svg viewBox="0 0 '+size+' '+size+'" style="width:'+size+'px;height:'+size+'px;transform:rotate(-90deg)">'+
      '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="'+stroke+'"></circle>'+
      '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+dash.toFixed(1)+' '+C.toFixed(1)+'"></circle>'+
    '</svg>'+
    '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">'+inner+'</div>'+
  '</div>';
}
function clampP(v){ return Math.max(0, Math.min(100, v)); }
function bar(value, max, color){
  return '<div class="bar"><i style="width:'+clampP(value/max*100).toFixed(1)+'%;background:'+color+'"></i></div>';
}
function macroRow(label, val, max, color){
  return '<div class="col" style="gap:5px">'+
    '<div class="b2 t2">'+label+'</div>'+
    '<div class="num b2" style="color:'+color+'">'+ar(val)+' / '+ar(max)+'<span class="t3"> جم</span></div>'+
    bar(val, max, color)+'</div>';
}
function lineChart(vals, w, h, labelLeft, labelRight){
  if (!vals.length) return "";
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  var pad = (max - min) || 1, top = 14, bot = h - 26;
  var pts = vals.map(function(v, i){
    var x = 12 + i * ((w - 24) / Math.max(1, vals.length - 1));
    var y = top + (max - v) / pad * (bot - top);
    return [x, y];
  });
  var line = pts.map(function(p, i){ return (i ? "L " : "M ") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
  var area = line + " L " + pts[pts.length-1][0].toFixed(1) + " " + h + " L " + pts[0][0].toFixed(1) + " " + h + " Z";
  var last = pts[pts.length-1];
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:'+h+'px" aria-hidden="true">'+
    '<path d="M12 '+top+'H'+(w-12)+'M12 '+((top+bot)/2).toFixed(0)+'H'+(w-12)+'M12 '+bot+'H'+(w-12)+'" stroke="var(--track)" stroke-width="1" fill="none"></path>'+
    '<path d="'+area+'" fill="var(--acc)" opacity="0.10"></path>'+
    '<path d="'+line+'" fill="none" stroke="var(--acc)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>'+
    '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="5" fill="var(--acc)"></circle>'+
    '<text x="'+(w-12)+'" y="'+(h-6)+'" text-anchor="end" fill="var(--t3)" font-size="11" font-family="Readex Pro,sans-serif">'+esc(labelLeft||"")+'</text>'+
    '<text x="12" y="'+(h-6)+'" text-anchor="start" fill="var(--t3)" font-size="11" font-family="Readex Pro,sans-serif">'+esc(labelRight||"")+'</text>'+
  '</svg>';
}
function barsChart(vals, labels, activeIndex, height){
  var max = Math.max.apply(null, vals) || 1, H = height || 92;
  return '<div style="display:flex;align-items:flex-end;gap:7px;height:'+(H+20)+'px">'+
    vals.map(function(v, i){
      var on = i === activeIndex;
      return '<div class="col" style="flex:1;align-items:center;gap:6px">'+
        '<div style="width:100%;height:'+Math.max(6, v/max*H).toFixed(0)+'px;border-radius:7px;background:'+(on?"var(--acc)":"var(--trackBg)")+'"></div>'+
        '<div class="cap '+(on?"acc":"t3")+'">'+esc(labels[i])+'</div></div>';
    }).join("")+'</div>';
}
function iconBtn(name, act, extra){
  return '<button class="card2 sq press" data-act="'+act+'" style="width:44px;height:44px;border-radius:14px" aria-label="'+(extra||act)+'">'+svg(name,"ic18")+'</button>';
}
function backHead(title, sub, right){
  return '<div class="head"><button class="sq press" data-act="back" style="width:44px;height:44px;margin-inline-start:-11px" aria-label="رجوع">'+svg("back")+'</button>'+
    '<div class="col" style="align-items:center;gap:1px"><div class="h2 t1">'+esc(title)+'</div>'+(sub?'<div class="b2 t3">'+esc(sub)+'</div>':"")+'</div>'+
    (right || '<div style="width:44px"></div>')+'</div>';
}

/* ---------- workouts ---------- */

/* ---------- progress / scale / steps ---------- */
function comp(w){
  var h = S.profile.h / 100, bmi = w / (h*h);

    '<div class="card" style="padding:14px 12px;display:flex;flex-direction:column;gap:4px"><div class="cap t3">باقي للهدف</div>'+
      '<div class="num h1 t1">'+ar(Math.abs(toGo),1)+'</div><div class="b2 t3">كجم إلى '+ar(S.profile.target)+'</div></div>'+

    '<div class="h3 t1">سجل الأوزان</div>'+

        '<div class="rowc" style="gap:10px"><div class="num b1 t1">'+ar(x.kg,1)+' كجم</div>'+
        (prev ? '<div class="num b2 '+(x.kg <= prev.kg ? "acc" : "t3")+'" style="width:52px;text-align:start">'+ar(Math.abs(x.kg-prev.kg),1)+(x.kg <= prev.kg ? "−" : "+")+'</div>' : '<div style="width:52px"></div>')+
        '</div></div>';
    }).join("")+
  '</div>'+
  '<button class="fill btn press" data-act="weighin" style="font-weight:600">سجّل وزن اليوم</button>';
}
function weightSheet(){

}
function vSteps(){

    row("star","هدفي وبياناتي", ar(S.profile.rate,1)+" كجم/أسبوع", "go", "bodydata").replace('<div class="hair"></div>',"")+

/* ================= interactions ================= */
var sheetState = { food:null, qty:0, meal:"الغداء", w:0, r:0, weight:0, exId:null, setIdx:0 };

function addItem(f, qty, meal){
  var it = A.item(f.id, qty);
  S.day.meals[meal] = S.day.meals[meal] || [];
  S.day.meals[meal].push(it);
  A.save();
}
function act(name, ds, target){
  var R = N.getRoute();
  switch (name){
    case "go": N.go(ds.to, { id: ds.id }); break;
    case "tab": N.tab(ds.to); break;
    case "back": N.back(); break;
    case "toast": N.toast(ds.msg); break;
    case "client": N.go("client", { id: ds.id }); break;
    case "tabchat": N.tab("cchat"); break;
    case "go2scale": N.go("scale", {}); break;

    case "addto":
      N.go("add", { meal: ds.meal || nextMeal() }); break;
    case "del":
      S.day.meals[ds.meal].splice(+ds.i, 1); A.save(); window.render(); N.toast("انحذف الصنف"); break;
    case "water":
      S.day.water = Math.max(0, Math.round((S.day.water + parseFloat(ds.v)) * 100) / 100); A.save(); window.render(); break;

    case "pick": {
      var f = FOOD_BY_ID[ds.id];
      sheetState.food = f; sheetState.qty = f.base; sheetState.meal = R.p.meal || nextMeal();
      N.openSheet(V1.foodSheet(f, sheetState.meal, sheetState.qty)); break;
    }
    case "scan": {
      var packaged = FOODS.filter(function(x){ return x.bc; });
      var f2 = packaged[Math.floor(Math.random() * packaged.length)];
      N.toast("قرأنا الباركود " + f2.bc);
      sheetState.food = f2; sheetState.qty = f2.base; sheetState.meal = R.p.meal || nextMeal();
      N.openSheet(V1.foodSheet(f2, sheetState.meal, sheetState.qty)); break;
    }
    case "manual":
      N.openSheet('<div class="grip"></div><div class="h2 t1">أضف صنفاً يدوياً</div>'+
        '<input class="f" id="mn" placeholder="اسم الصنف">'+
        '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">'+
        '<input class="f" id="mk" inputmode="numeric" placeholder="السعرات">'+
        '<input class="f" id="mp" inputmode="numeric" placeholder="بروتين جم">'+
        '<input class="f" id="mc" inputmode="numeric" placeholder="كارب جم">'+
        '<input class="f" id="mf" inputmode="numeric" placeholder="دهون جم"></div>'+
        '<div class="rowc" style="gap:10px"><button class="ghost btn press" data-act="closesheet" style="flex:1">إلغاء</button>'+
        '<button class="fill btn press" data-act="savemanual" style="flex:1.6;font-weight:600">أضف لـ'+(R.p.meal || nextMeal())+'</button></div>');
      break;
    case "savemanual": {
      var nm = (document.getElementById("mn").value || "صنف يدوي").slice(0, 40);
      var it = { fid:"manual", n:nm, u:"حصة", base:1, qty:1,
        kcal:+document.getElementById("mk").value || 0, p:+document.getElementById("mp").value || 0,
        c:+document.getElementById("mc").value || 0, f:+document.getElementById("mf").value || 0 };
      var meal = R.p.meal || nextMeal();
      (S.day.meals[meal] = S.day.meals[meal] || []).push(it); A.save();
      N.closeSheet(); N.tab("diary"); N.toast("أُضيف " + nm); break;
    }
    case "quick": {
      var meal2 = R.p.meal || nextMeal();
      var preset = { "الفطور":["egg","coffee"], "الغداء":["chick","rice"], "سناك":["yog","almond"], "العشاء":["salmon","broc"] }[meal2];
      preset.forEach(function(id){ addItem(FOOD_BY_ID[id], FOOD_BY_ID[id].base, meal2); });
      N.tab("diary"); N.toast("تكرّرت وجبة أمس"); break;
    }
    case "qty": {
      var step = parseFloat(ds.d);
      sheetState.qty = Math.max(step > 0 ? step : 1, Math.round((sheetState.qty + step) * 10) / 10);
      N.closeSheet(); N.openSheet(V1.foodSheet(sheetState.food, sheetState.meal, sheetState.qty)); break;
    }
    case "setmeal":
      sheetState.meal = ds.meal;
      N.closeSheet(); N.openSheet(V1.foodSheet(sheetState.food, sheetState.meal, sheetState.qty)); break;
    case "confirm":
      addItem(sheetState.food, sheetState.qty, sheetState.meal);
      N.closeSheet(); N.tab("diary"); N.toast("أُضيف " + sheetState.food.n + " لـ" + sheetState.meal); break;
    case "closesheet": N.closeSheet(); break;

    case "setdiet":
      S.profile.diet = ds.id; A.save(); window.render();
      N.toast("فعّلنا " + DIET_BY_ID[ds.id].n + " وحدّثنا ماكروزك"); break;

    case "weighin":
      sheetState.weight = S.weights[S.weights.length-1].kg;
      N.openSheet(V2.weightSheet()); break;
    case "wv": {
      sheetState.weight = Math.max(30, Math.round((sheetState.weight + parseFloat(ds.d)) * 10) / 10);
      var wv = document.getElementById("wv"); if (wv) wv.textContent = ar(sheetState.weight, 1); break;
    }
    case "savew":
      S.weights.push({ d:"اليوم", kg:sheetState.weight }); S.profile.w = sheetState.weight;
      if (S.weights.length > 12) S.weights.shift();
      A.save(); N.closeSheet(); window.render(); N.toast("انحفظ وزنك"); break;
    case "scaleread": {
      var last = S.weights[S.weights.length-1].kg;
      var nw = Math.round((last - (Math.random() * 0.5 - 0.1)) * 10) / 10;
      S.weights.push({ d:"قراءة الميزان", kg:nw }); S.profile.w = nw;
      if (S.weights.length > 12) S.weights.shift();
      A.save(); window.render(); N.toast("قراءة جديدة: " + ar(nw,1) + " كجم"); break;
    }

    case "setedit": {
      sheetState.exId = ds.id; sheetState.setIdx = +ds.i;
      var s = V2.setsOf(ds.id)[+ds.i];
      sheetState.w = s.w || 60; sheetState.r = s.r || 10;
      N.openSheet(V2.setSheet(ds.id, +ds.i)); break;
    }
    case "sw": {
      sheetState.w = Math.max(0, sheetState.w + parseFloat(ds.d));
      var swEl = document.getElementById("sw"); if (swEl) swEl.textContent = ar(sheetState.w, sheetState.w % 1 ? 1 : 0); break;
    }
    case "sr": {
      sheetState.r = Math.max(1, sheetState.r + parseFloat(ds.d));
      var srEl = document.getElementById("sr"); if (srEl) srEl.textContent = ar(sheetState.r); break;
    }
    case "saveset": {
      var arr = V2.setsOf(ds.id);
      arr[+ds.i] = { w:sheetState.w, r:sheetState.r, d:true };
      A.save(); N.closeSheet(); window.render(); N.toast("سُجّلت المجموعة"); break;
    }
    case "addset":
      V2.setsOf(ds.id).push({ w:0, r:0, d:false }); A.save(); window.render(); break;

    case "pnum": {
      var k = ds.k, d = parseFloat(ds.d);
      S.profile[k] = Math.max(1, Math.round((S.profile[k] + d) * 10) / 10);
      if (k === "w") S.weights[S.weights.length-1].kg = S.profile.w;
      A.save(); window.render(); break;
    }
    case "gender": S.profile.gender = ds.v; A.save(); window.render(); break;
    case "activity": S.profile.activity = ds.v; A.save(); window.render(); break;
    case "rate": S.profile.rate = parseFloat(ds.v); A.save(); window.render(); break;

    case "eatplan":
      addItem(FOOD_BY_ID.chick, 150, "العشاء");
      addItem(FOOD_BY_ID.broc, 150, "العشاء");
      addItem(FOOD_BY_ID.oil, 1, "العشاء");
      window.render(); N.toast("سجّلنا عشاء الخطة — ووصل للكوتش"); break;

    case "quickmsg":
    case "send": {
      var input = document.getElementById("msg");
      var text = name === "quickmsg" ? ds.msg : (input && input.value.trim());
      if (!text) break;
      S.chat.push({ me: S.role === "coach", t: text }); A.save(); window.render();
      els.scroll.scrollTop = els.scroll.scrollHeight; break;
    }

    case "theme": toggleTheme(); break;
    case "role": switchRole(); break;
    case "reset":
      try { localStorage.removeItem(A.KEY); } catch(e){}
      location.reload(); break;
  }
}

/* theme + role */
function currentTheme(){
  var s = document.documentElement.getAttribute("data-app-theme");
  return s || "dark";
}
function applyTheme(t){
  document.documentElement.setAttribute("data-app-theme", t);
  S.theme = t; A.save();
  document.getElementById("themeBtn").textContent = t === "light" ? "داكن" : "فاتح";
}
function toggleTheme(){ applyTheme(currentTheme() === "light" ? "dark" : "light"); window.render(); }
function switchRole(){
  S.role = S.role === "coach" ? "trainee" : "coach";
  A.save();
  N.setRoute({ name: S.role === "coach" ? "chome" : "home", p:{} });
  document.getElementById("roleBtn").textContent = S.role === "coach" ? "وضع المتدرب" : "وضع المدرّب";
  document.getElementById("roleBtn").className = "tinybtn" + (S.role === "coach" ? " on" : "");
  window.render();
  N.toast(S.role === "coach" ? "دخلت وضع المدرّب" : "رجعت لوضع المتدرب");
}

els.phone.addEventListener("click", function(e){
  var b = e.target.closest("[data-act]");
  if (!b) return;
  act(b.getAttribute("data-act"), b.dataset, b);
});
document.getElementById("themeBtn").addEventListener("click", toggleTheme);
document.getElementById("roleBtn").addEventListener("click", switchRole);
document.getElementById("resetBtn").addEventListener("click", function(){ act("reset", {}); });
document.addEventListener("keydown", function(e){
  if (e.key === "Enter" && document.activeElement && document.activeElement.id === "msg") act("send", {});
});

/* init */
(function init(){
  var t = S.theme;
  if (!t){
    var hostDark = document.documentElement.getAttribute("data-theme") === "dark" ||
      (!document.documentElement.getAttribute("data-theme") && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    t = hostDark ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-app-theme", t);
  document.getElementById("themeBtn").textContent = t === "light" ? "داكن" : "فاتح";
  if (S.role === "coach"){
    N.setRoute({ name:"chome", p:{} });
    document.getElementById("roleBtn").textContent = "وضع المتدرب";
    document.getElementById("roleBtn").className = "tinybtn on";
  }
  window.render();
})();
})();
</script>
