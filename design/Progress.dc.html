<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0A0C0B; font-family: 'Readex Pro', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #C8F751; text-decoration: none; }
    a:hover { color: #E2FF9A; }
    .scr { width: 390px; height: 844px; background: #0A0C0B; color: #EDF2EE; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .safeTop { height: 52px; flex: none; }
    .body { flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 0 20px 10px; overflow: hidden; }
    .d1 { font-size: 34px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
    .h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; }
    .h2 { font-size: 16.5px; font-weight: 600; line-height: 1.35; }
    .h3 { font-size: 14.5px; font-weight: 500; line-height: 1.4; }
    .b1 { font-size: 13.5px; font-weight: 300; line-height: 1.6; }
    .b2 { font-size: 12px; font-weight: 300; line-height: 1.5; }
    .cap { font-size: 10.5px; font-weight: 400; letter-spacing: 0.06em; }
    .num { font-family: 'Space Grotesk', 'Readex Pro', system-ui, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
    .t1 { color: #EDF2EE; }
    .t2 { color: #A9B5AE; }
    .t3 { color: #74807A; }
    .ink { color: #0A0C0B; }
    .card { background: #131715; border: 1px solid rgba(255,255,255,0.07); border-radius: 22px; }
    .card2 { background: #1A201D; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; }
    .hair { background: rgba(255,255,255,0.07); }
    .accent { color: #C8F751; }
    .accentSoft { background: rgba(200,247,81,0.12); color: #C8F751; }
    .fill { background: #C8F751; color: #0A0C0B; }
    .ghost { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09); color: #EDF2EE; }
    .track { stroke: rgba(255,255,255,0.09); }
    .trackBg { background: rgba(255,255,255,0.08); }
    .mP { color: #C8F751; } .mC { color: #7FD4FF; } .mF { color: #FFC46B; }
    .mPb { background: #C8F751; } .mCb { background: #7FD4FF; } .mFb { background: #FFC46B; }
    .mPs { stroke: #C8F751; } .mCs { stroke: #7FD4FF; } .mFs { stroke: #FFC46B; }
    .accentS { stroke: #C8F751; }
    .ic { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .ic18 { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .ic14 { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .nav { flex: none; height: 88px; background: rgba(10,12,11,0.92); border-top: 1px solid rgba(255,255,255,0.07); display: flex; align-items: flex-start; justify-content: space-between; padding: 12px 18px 0; }
    .navi { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 58px; min-height: 46px; color: #6C7873; }
    .naviOn { color: #C8F751; }
    .fab { width: 56px; height: 56px; border-radius: 20px; background: #C8F751; color: #0A0C0B; display: flex; align-items: center; justify-content: center; margin-top: -14px; box-shadow: 0 10px 24px rgba(200,247,81,0.22); }
    .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
    .rowc { display: flex; align-items: center; gap: 12px; }
    .btn { min-height: 52px; border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 500; }
    .chip { min-height: 36px; padding: 0 14px; border-radius: 12px; display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 400; }
    .seg { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 4px; display: flex; gap: 4px; }
    .segi { flex: 1; min-height: 36px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 12.5px; }
    .segOn { background: #C8F751; color: #0A0C0B; font-weight: 500; }
    .glow { position: absolute; border-radius: 999px; filter: blur(70px); opacity: 0.5; pointer-events: none; }
  </style>
</helmet>

<div class="scr" dir="rtl">
  <div class="safeTop"></div>
  <div class="body">

    <div class="head">
      <div class="h1 t1">التقدّم</div>
      <div class="card2" style="width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;">
        <svg class="ic18 t2" viewBox="0 0 24 24"><path d="M12 15.6V4.6M8.4 8.2 12 4.6l3.6 3.6M5 15.6v3.2a.8.8 0 0 0 .8.8h12.4a.8.8 0 0 0 .8-.8v-3.2"/></svg>
      </div>
    </div>

    <div class="seg">
      <div class="segi segOn">الوزن</div>
      <div class="segi t2">الدهون</div>
      <div class="segi t2">المقاسات</div>
      <div class="segi t2">القوة</div>
    </div>

    <div class="card" style="padding:18px 16px 14px;display:flex;flex-direction:column;gap:14px;">
      <div class="rowc" style="justify-content:space-between;align-items:flex-start;">
        <div style="display:flex;flex-direction:column;gap:3px;">
          <div class="cap t3">الوزن الحالي</div>
          <div class="rowc" style="gap:8px;">
            <div class="num d1 t1">٨١٫٤</div>
            <div class="b1 t3" style="padding-bottom:6px;">كجم</div>
          </div>
        </div>
        <div class="accentSoft chip" style="min-height:28px;">
          <svg class="ic14" viewBox="0 0 24 24"><path d="M12 18V6M7.6 10.4 12 6l4.4 4.4" transform="rotate(180 12 12)"/></svg>
          ٤٫٢− كجم في ٨ أسابيع
        </div>
      </div>

      <svg viewBox="0 0 320 120" style="width:100%;height:120px;">
        <path class="track" d="M8 96h304M8 66h304M8 36h304" stroke-width="1" fill="none"></path>
        <path d="M12 26 L 62 34 L 112 44 L 162 42 L 212 62 L 262 76 L 308 88 L 308 116 L 12 116 Z" fill="#C8F751" opacity="0.10"></path>
        <path class="accentS" d="M12 26 L 62 34 L 112 44 L 162 42 L 212 62 L 262 76 L 308 88" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
        <circle cx="308" cy="88" r="5" fill="#C8F751"></circle>
      </svg>
      <div class="rowc" style="justify-content:space-between;">
        <div class="cap t3">يوليو</div>
        <div class="cap t3">أغسطس</div>
        <div class="cap t3">سبتمبر</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px;">
      <div class="card" style="padding:14px 12px;display:flex;flex-direction:column;gap:4px;">
        <div class="cap t3">نسبة الدهون</div>
        <div class="num h1 t1">٢١٫٣٪</div>
        <div class="b2 accent">٢٫٤− نقطة</div>
      </div>
      <div class="card" style="padding:14px 12px;display:flex;flex-direction:column;gap:4px;">
        <div class="cap t3">كتلة العضل</div>
        <div class="num h1 t1">٥٨٫٦</div>
        <div class="b2 accent">١٫١+ كجم</div>
      </div>
      <div class="card" style="padding:14px 12px;display:flex;flex-direction:column;gap:4px;">
        <div class="cap t3">الخصر</div>
        <div class="num h1 t1">٨٨</div>
        <div class="b2 accent">٦− سم</div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;flex:1;">
      <div class="rowc" style="justify-content:space-between;">
        <div class="h2 t1">صور التقدّم</div>
        <div class="b2 accent">إضافة صورة</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px;">
        <div class="card2" style="height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;">
          <svg class="ic t3" viewBox="0 0 24 24"><path d="M12 4.6c-2 2.4-3 4.4-3 6.4a3 3 0 0 0 6 0c0-2-1-4-3-6.4zM8.4 20h7.2M12 14v6"/></svg>
          <div class="cap t3">١ يوليو</div>
        </div>
        <div class="card2" style="height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;">
          <svg class="ic t3" viewBox="0 0 24 24"><path d="M12 4.6c-2 2.4-3 4.4-3 6.4a3 3 0 0 0 6 0c0-2-1-4-3-6.4zM8.4 20h7.2M12 14v6"/></svg>
          <div class="cap t3">٥ أغسطس</div>
        </div>
        <div class="card2" style="height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-style:dashed;">
          <svg class="ic18 accent" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg>
          <div class="cap t3">اليوم</div>
        </div>
      </div>
    </div>

  </div>
  <div class="nav">
  <div class="navi ">
    <svg class="ic" viewBox="0 0 24 24"><path d="M3.5 10.6 12 4.2l8.5 6.4V19a1.6 1.6 0 0 1-1.6 1.6h-3.6v-6h-6.6v6H5.1A1.6 1.6 0 0 1 3.5 19z"/></svg>
    <div class="cap">الرئيسية</div>
  </div>
  <div class="navi ">
    <svg class="ic" viewBox="0 0 24 24"><path d="M7 3.2v6.6a2.4 2.4 0 0 0 4.8 0V3.2M9.4 9.8v11M17.4 3.2c-1.6 1.4-2.3 3.1-2.3 5.4 0 1.6.8 2.6 2.3 2.6v9.6"/></svg>
    <div class="cap">الوجبات</div>
  </div>
  <div class="fab">
    <svg class="ic" viewBox="0 0 24 24" style="width:26px;height:26px;stroke-width:1.8"><path d="M12 5.5v13M5.5 12h13"/></svg>
  </div>
  <div class="navi ">
    <svg class="ic" viewBox="0 0 24 24"><path d="M4 9.2v5.6M7.2 6.8v10.4M16.8 6.8v10.4M20 9.2v5.6M7.2 12h9.6"/></svg>
    <div class="cap">التمارين</div>
  </div>
  <div class="navi naviOn">
    <svg class="ic" viewBox="0 0 24 24"><path d="M4 19.4h16M7.4 16.2V9.6M12 16.2V4.8M16.6 16.2v-4.4"/></svg>
    <div class="cap">التقدّم</div>
  </div>
</div>

</div>
</x-dc>
</body>
</html>
