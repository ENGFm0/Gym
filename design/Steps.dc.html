<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0A0C0B; font-family: 'Readex Pro', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #C8F751; text-decoration: none; }
    a:hover { color: #E2FF9A; }
    .scr { width: 390px; height: 844px; background: #0A0C0B; color: #EDF2EE; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .safeTop { height: 52px; flex: none; }
    .body { flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 0 20px 10px; overflow: hidden; }
    .d1 { font-size: 34px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
    .h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; }
    .h2 { font-size: 16.5px; font-weight: 600; line-height: 1.35; }
    .h3 { font-size: 14.5px; font-weight: 500; line-height: 1.4; }
    .b1 { font-size: 13.5px; font-weight: 300; line-height: 1.6; }
    .b2 { font-size: 12px; font-weight: 300; line-height: 1.5; }
    .cap { font-size: 10.5px; font-weight: 400; letter-spacing: 0.06em; }
    .num { font-family: 'Space Grotesk', 'Readex Pro', system-ui, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
    .t1 { color: #EDF2EE; }
    .t2 { color: #A9B5AE; }
    .t3 { color: #74807A; }
    .ink { color: #0A0C0B; }
    .card { background: #131715; border: 1px solid rgba(255,255,255,0.07); border-radius: 22px; }
    .card2 { background: #1A201D; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; }
    .hair { background: rgba(255,255,255,0.07); }
    .accent { color: #C8F751; }
    .accentSoft { background: rgba(200,247,81,0.12); color: #C8F751; }
    .fill { background: #C8F751; color: #0A0C0B; }
    .ghost { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09); color: #EDF2EE; }
    .track { stroke: rgba(255,255,255,0.09); }
    .trackBg { background: rgba(255,255,255,0.08); }
    .mP { color: #C8F751; } .mC { color: #7FD4FF; } .mF { color: #FFC46B; }
    .mPb { background: #C8F751; } .mCb { background: #7FD4FF; } .mFb { background: #FFC46B; }
    .mPs { stroke: #C8F751; } .mCs { stroke: #7FD4FF; } .mFs { stroke: #FFC46B; }
    .accentS { stroke: #C8F751; }
    .ic { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .ic18 { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .ic14 { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .nav { flex: none; height: 88px; background: rgba(10,12,11,0.92); border-top: 1px solid rgba(255,255,255,0.07); display: flex; align-items: flex-start; justify-content: space-between; padding: 12px 18px 0; }
    .navi { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 58px; min-height: 46px; color: #6C7873; }
    .naviOn { color: #C8F751; }
    .fab { width: 56px; height: 56px; border-radius: 20px; background: #C8F751; color: #0A0C0B; display: flex; align-items: center; justify-content: center; margin-top: -14px; box-shadow: 0 10px 24px rgba(200,247,81,0.22); }
    .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
    .rowc { display: flex; align-items: center; gap: 12px; }
    .btn { min-height: 52px; border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 500; }
    .chip { min-height: 36px; padding: 0 14px; border-radius: 12px; display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 400; }
    .seg { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 4px; display: flex; gap: 4px; }
    .segi { flex: 1; min-height: 36px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 12.5px; }
    .segOn { background: #C8F751; color: #0A0C0B; font-weight: 500; }
    .glow { position: absolute; border-radius: 999px; filter: blur(70px); opacity: 0.5; pointer-events: none; }
  </style>
</helmet>

<div class="scr" dir="rtl">
  <div class="glow" style="width:230px;height:230px;background:#7FD4FF;top:-100px;left:-70px;"></div>
  <div class="safeTop"></div>
  <div class="body">

    <div class="head">
      <svg class="ic t2" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></svg>
      <div class="h2 t1">المشي والنشاط</div>
      <svg class="ic t2" viewBox="0 0 24 24"><path d="M7.6 3.4v3M16.4 3.4v3M4 8.4h16M5.6 5.4h12.8A1.6 1.6 0 0 1 20 7v11.4a1.6 1.6 0 0 1-1.6 1.6H5.6A1.6 1.6 0 0 1 4 18.4V7a1.6 1.6 0 0 1 1.6-1.6z"/></svg>
    </div>

    <div class="card" style="padding:24px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:16px;">
      <div style="position:relative;width:190px;height:190px;">
        <svg viewBox="0 0 200 200" style="width:190px;height:190px;transform:rotate(-90deg);">
          <circle class="track" cx="100" cy="100" r="84" fill="none" stroke-width="14"></circle>
          <circle class="accentS" cx="100" cy="100" r="84" fill="none" stroke-width="14" stroke-linecap="round" stroke-dasharray="391 528"></circle>
        </svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;">
          <svg class="ic18 accent" viewBox="0 0 24 24" style="margin-bottom:2px;"><path d="M8.6 3.6c1.5 0 2.3 1.3 2.3 3s-.6 3.2-2.1 3.2-2.4-1.4-2.4-3.1.7-3.1 2.2-3.1zM15.6 6.4c1.3 0 2 1.1 2 2.6s-.6 2.8-1.9 2.8-2-1.2-2-2.7.6-2.7 1.9-2.7zM7 13.2c-1.4 1.6-1 4 .4 4.9 1 .6 2 .2 2.8.7.9.6.6 1.9 2 1.6 1.6-.3 1.7-2.4 1-3.6-.7-1.2-1.7-1.6-2.2-2.7-.5-1.1-2.6-2.5-4-.9z"/></svg>
          <div class="num t1" style="font-size:40px;font-weight:600;">٧٬٤٢٠</div>
          <div class="b2 t3">من هدف ١٠٬٠٠٠ خطوة</div>
        </div>
      </div>
      <div class="rowc" style="gap:20px;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
          <div class="num h2 t1">٥٫٤</div><div class="cap t3">كم</div>
        </div>
        <div class="hair" style="width:1px;height:32px;"></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
          <div class="num h2 t1">٢١٠</div><div class="cap t3">سعرة</div>
        </div>
        <div class="hair" style="width:1px;height:32px;"></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
          <div class="num h2 t1">٦٨</div><div class="cap t3">دقيقة حركة</div>
        </div>
      </div>
    </div>

    <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px;">
      <div class="rowc" style="justify-content:space-between;">
        <div class="h3 t1">آخر ٧ أيام</div>
        <div class="b2 t3">المتوسط ٨٬١٠٠</div>
      </div>
      <div style="display:flex;align-items:flex-end;gap:8px;height:110px;">
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;"><div class="trackBg" style="width:100%;height:58px;border-radius:8px;"></div><div class="cap t3">س</div></div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;"><div class="trackBg" style="width:100%;height:82px;border-radius:8px;"></div><div class="cap t3">ح</div></div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;"><div class="trackBg" style="width:100%;height:44px;border-radius:8px;"></div><div class="cap t3">ن</div></div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;"><div class="trackBg" style="width:100%;height:90px;border-radius:8px;"></div><div class="cap t3">ث</div></div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;"><div class="trackBg" style="width:100%;height:70px;border-radius:8px;"></div><div class="cap t3">ر</div></div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;"><div class="trackBg" style="width:100%;height:52px;border-radius:8px;"></div><div class="cap t3">خ</div></div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;"><div class="mPb" style="width:100%;height:74px;border-radius:8px;"></div><div class="cap accent">ج</div></div>
      </div>
    </div>

    <div class="card" style="padding:6px 16px;flex:1;">
      <div class="rowc" style="justify-content:space-between;min-height:52px;">
        <div class="rowc" style="gap:10px;">
          <svg class="ic18 t2" viewBox="0 0 24 24"><path d="M9 3.6h6a2 2 0 0 1 2 2v12.8a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V5.6a2 2 0 0 1 2-2zM11 17.6h2"/></svg>
          <div class="b1 t2">مصدر الخطوات</div>
        </div>
        <div class="b1 t1">صحة آيفون</div>
      </div>
      <div class="hair" style="height:1px;"></div>
      <div class="rowc" style="justify-content:space-between;min-height:52px;">
        <div class="rowc" style="gap:10px;">
          <svg class="ic18 t2" viewBox="0 0 24 24"><path d="M12 4.4a7.6 7.6 0 1 0 0 15.2 7.6 7.6 0 0 0 0-15.2zM12 8.6v3.6l2.4 1.4"/></svg>
          <div class="b1 t2">خصم سعرات المشي من الهدف</div>
        </div>
        <div class="fill" style="width:44px;height:26px;border-radius:99px;display:flex;align-items:center;justify-content:flex-start;padding:3px;">
          <div style="width:20px;height:20px;border-radius:99px;background:#0A0C0B;"></div>
        </div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
