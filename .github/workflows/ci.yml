name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('server/**/*.csproj') }}
          restore-keys: nuget-

      - run: dotnet restore FitCore.sln

      - run: dotnet build FitCore.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/FitCore.Application.Tests/FitCore.Application.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: server/tests/**/TestResults/*.trx
          if-no-files-found: ignore

  web:
    name: Web — type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Smoke-test the built app
        run: |
          npx playwright install --with-deps chromium
          node scripts/smoke.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-dist
          path: client/dist
          if-no-files-found: ignore

  images:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [api, web]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
